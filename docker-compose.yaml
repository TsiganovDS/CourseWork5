version: '3.8'
services:
    web:
        container_name: CourseWork5-web
        build: ./backend
        command: bash -c "python manage.py collect_static --no-input && python manage.py migrate && gunicorn config.wsgi:application --bind 0.0.0.0:8000"
        volumes:
            - ./backend:/code
            - static_volume:/code/staticfiles
            - media_volume:/code/media
        expose:
            - 8000
        env_file:
            - .env
        depends_on:
            - db
            - cache

    db:
        image: postgres:16
        container_name: myproject-db
        volumes:
            - pgdata:/var/lib/postgresql/data
        env_file:
            - .env

    cache:
        image: redis:alpine
        container_name: myproject-cache
        ports:
            - "6379:6379"

    celery:
        container_name: CourseWork5-celery
        build: ./backend
        command: bash -c "celery -A project worker -l info"
        volumes:
            - ./backend:/code
        env_file:
            - .env
        depends_on:
            - cache

    celery-beat:
        container_name: CourseWork5-celery-beat
        build: ./backend
        command: bash -c "celery -A project beat -l info"
        volumes:
            - ./backend:/code
        env_file:
            - .env
        depends_on:
            - cache

    frontend:
        build: ./frontend
        container_name: myproject-frontend
        command: npm start
        ports:
            - "3000:3000"
        volumes:
            - ./frontend:/app
        working_dir: "/app"
        depends_on:
            - web

    nginx:
        container_name: CourseWork5-nginx
        build: ./nginx
        ports:
            - "80:80"
        volumes:
            - static_volume:/usr/share/nginx/html/static
            - media_volume:/usr/share/nginx/html/media
        depends_on:
            - web

volumes:
    pgdata:
    static_volume:
    media_volume: