{% extends 'HabitAtom/base.html' %}
{% block content %}
  <h2>Удалить привычку "{{ object.name }}"?</h2>
  <form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Да, удалить</button>
    <a href="{% url 'habit_list' %}" class="btn btn-secondary">Нет, отменить</a>
  </form>
{% endblock %}
