{% extends 'HabitAtom/base.html' %}
{% block content %}
  <h2>Восстановить пароль</h2>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-warning">Сбросить пароль</button>
    <a href="{% url 'login' %}" class="btn btn-link">Войти</a>
  </form>
{% endblock %}
