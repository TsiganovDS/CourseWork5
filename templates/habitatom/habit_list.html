{% extends 'HabitAtom/base.html' %}
{% block content %}
  <h1>Мои привычки</h1>
  <a class="btn btn-success mb-3" href="{% url 'habit_create' %}">Добавить привычку</a>
  <ul class="list-group">
    {% for habit in habits %}
      <li class="list-group-item d-flex justify-content-between align-items-center">
        <a href="{% url 'habit_detail' habit.pk %}">{{ habit.name }}</a>
        <span>
          <a href="{% url 'habit_edit' habit.pk %}" class="btn btn-sm btn-primary">✏️</a>
          <a href="{% url 'habit_confirm_delete' habit.pk %}" class="btn btn-sm btn-danger">❌</a>
        </span>
      </li>
    {% empty %}
      <li class="list-group-item">Пока нет привычек.</li>
    {% endfor %}
  </ul>
{% endblock %}
