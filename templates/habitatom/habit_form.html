{% extends 'HabitAtom/base.html' %}
{% block content %}
  <h2>{% if object %}Редактировать{% else %}Создать{% endif %} привычку</h2>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-success">Сохранить</button>
    <a href="{% url 'habit_list' %}" class="btn btn-secondary">Отмена</a>
  </form>
{% endblock %}
